<section><h2>Section 2</h2></section>
<section><h2>Section 3</h2></section>
<section><h2>Section 4</h2></section>
<script>
  // A requestAnimationFrame loop, so the homepage fps measurement has a live animation to count.
  const spinner = document.getElementById("spinner");
  function frame(t) {
    spinner.style.transform = "rotate(" + ((t / 10) % 360) + "deg)";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
